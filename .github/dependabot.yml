version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      # Include workspace manifests in the same group as the root lockfile.
      - /apps/*
      - /packages/*
      - /testing/provider-lab/homey-fixture-app
    schedule:
      interval: weekly
    # Keep security fixes enabled without opening routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
