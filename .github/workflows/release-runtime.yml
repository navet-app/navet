name: Verify published runtime

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    name: Test published digests (${{ matrix.arch }})
    if: github.repository == 'navet-app/navet' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/navet-dev-'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .release-tools
          persist-credentials: false
      - name: Checkout verified release source
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "Release source must be a full commit SHA."; exit 1; }
          git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main || { echo "Release source is not in protected main."; exit 1; }
          git checkout --detach "${RELEASE_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Verify image identity and installed runtime
        env:
          NAVET_ADDON_TEST_ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node .release-tools/scripts/release-prebuilt-runtime.mjs
