name: Promote Navet Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (blank tags are selected automatically)
        type: choice
        default: beta
        options:
          - beta
          - rc
          - stable
      preview_only:
        description: Preview selected tags without publishing
        type: boolean
        default: true
      installation_tested:
        description: I installed and tested the selected beta/RC before promoting it to stable
        type: boolean
        default: false
      source_tag:
        description: Optional source override (blank selects latest eligible published build)
        type: string
      release_tag:
        description: Optional target override (blank selects next version for the channel)
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: navet-release-promotion
  cancel-in-progress: false

jobs:
  promote-release:
    if: github.ref == 'refs/heads/main'
    name: Validate And Promote Tested Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Select source and target
        id: selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          node scripts/release-promotion.mjs

      - name: Validate promotion
        if: steps.selection.outputs.no_promotion != 'true'
        id: promotion
        env:
          RELEASE_TAG: ${{ steps.selection.outputs.release_tag }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          INSTALLATION_TESTED: ${{ inputs.installation_tested }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Release tag must look like v0.18.0, v0.18.0-beta.1, or v0.18.0-rc.1."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${SOURCE_TAG}^{commit}" >/dev/null; then
            echo "Source release tag does not exist: ${SOURCE_TAG}"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag already exists: ${RELEASE_TAG}"
            exit 1
          fi

          if [[ "${RELEASE_TAG}" == *-beta.* ]]; then
            [[ "${SOURCE_TAG}" == navet-dev-* ]] || {
              echo "A beta must promote an immutable Navet Dev tag."
              exit 1
            }
          elif [[ "${RELEASE_TAG}" == *-rc.* ]]; then
            [[ "${SOURCE_TAG}" == navet-dev-* || "${SOURCE_TAG}" == v*-beta.* || "${SOURCE_TAG}" == v*-rc.* ]] || {
              echo "A release candidate must promote a Dev, beta, or earlier RC tag."
              exit 1
            }
          else
            [[ "${PREVIEW_ONLY}" == true || "${INSTALLATION_TESTED}" == true ]] || { echo "Install and test the selected beta/RC before stable promotion."; exit 1; }
            [[ "${SOURCE_TAG}" == v*-beta.* || "${SOURCE_TAG}" == v*-rc.* ]] || {
              echo "A stable release must promote a tested beta or release candidate."
              exit 1
            }
          fi

          if [[ "${SOURCE_TAG}" == v* ]]; then
            TARGET_BASE="${RELEASE_TAG%%-*}"
            SOURCE_BASE="${SOURCE_TAG%%-*}"
            [[ "${TARGET_BASE}" == "${SOURCE_BASE}" ]] || {
              echo "Source and target release tags must use the same base version."
              exit 1
            }
          fi

          SOURCE_SHA="$(git rev-list -n 1 "${SOURCE_TAG}")"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo "The promoted commit must be contained in protected main."
            exit 1
          }

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - if: steps.selection.outputs.no_promotion != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Require successful source publication before creating a tag
        if: steps.selection.outputs.no_promotion != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          RELEASE_SHA: ${{ steps.promotion.outputs.source_sha }}
        run: node scripts/release-evidence.mjs verify-source

      - name: Create and push promoted release tag
        if: ${{ steps.selection.outputs.no_promotion != 'true' && !inputs.preview_only }}
        env:
          RELEASE_TAG: ${{ steps.selection.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${SOURCE_SHA}" \
            -m "Release ${RELEASE_TAG}" \
            -m "Promoted-From: ${SOURCE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Dispatch artifact promotion
        if: ${{ steps.selection.outputs.no_promotion != 'true' && !inputs.preview_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.selection.outputs.release_tag }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
          INSTALLATION_TESTED: ${{ inputs.installation_tested }}
        run: gh workflow run release.yml --ref main -f release_tag="${RELEASE_TAG}" -f source_tag="${SOURCE_TAG}" -f installation_tested="${INSTALLATION_TESTED}"

      - name: Summarize promotion
        if: ${{ steps.selection.outputs.no_promotion != 'true' && !inputs.preview_only }}
        env:
          RELEASE_TAG: ${{ steps.selection.outputs.release_tag }}
          SOURCE_TAG: ${{ steps.selection.outputs.source_tag }}
        run: |
          echo "Promoted ${SOURCE_TAG} to ${RELEASE_TAG} without advancing protected main."
          echo "The release workflow will build correctly versioned artifacts and test their published digests."
