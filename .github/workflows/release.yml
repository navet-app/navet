name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to publish or recover
        required: true
        type: string
      installation_tested:
        description: I installed and tested the selected beta/RC before stable publication
        type: boolean
        default: false
      source_tag:
        description: Tested Dev, beta, or release-candidate tag being promoted
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: navet-release-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  REGISTRY: ghcr.io
  IMAGE_NAME: awesomestvi/navet
  HACS_REPOSITORY: navet-app/navet-home-assistant

jobs:
  release-context:
    name: Validate Promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_environment: ${{ steps.release.outputs.release_environment }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      notes_base_tag: ${{ steps.release.outputs.notes_base_tag }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refuse stale publication before modifying distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs
      - name: Resolve and validate promotion
        id: release
        env:
          DISPATCH_SOURCE_TAG: ${{ inputs.source_tag }}
          INSTALLATION_TESTED: ${{ inputs.installation_tested }}
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          TAG_NAME="${RELEASE_TAG}"
          [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]] || { echo "Unsupported release tag: ${TAG_NAME}"; exit 1; }
          [[ "$(git cat-file -t "refs/tags/${TAG_NAME}")" == tag ]] || { echo "Release tag must be annotated."; exit 1; }
          ANNOTATED_SOURCE_TAG="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG_NAME}" | sed -n 's/^Promoted-From: //p' | tail -n 1)"
          SOURCE_TAG="${DISPATCH_SOURCE_TAG:-${ANNOTATED_SOURCE_TAG}}"
          [[ -n "${SOURCE_TAG}" && "${SOURCE_TAG}" == "${ANNOTATED_SOURCE_TAG}" ]] || { echo "Source tag does not match Promoted-From provenance."; exit 1; }
          if [[ "${TAG_NAME}" == *-beta.* ]]; then
            [[ "${SOURCE_TAG}" == navet-dev-* ]] || { echo "A beta must promote an immutable Dev tag."; exit 1; }
          elif [[ "${TAG_NAME}" == *-rc.* ]]; then
            [[ "${SOURCE_TAG}" == navet-dev-* || "${SOURCE_TAG}" == v*-beta.* || "${SOURCE_TAG}" == v*-rc.* ]] || { echo "An RC must promote Dev, beta, or an earlier RC."; exit 1; }
          else
            [[ "${SOURCE_TAG}" == v*-beta.* || "${SOURCE_TAG}" == v*-rc.* ]] || { echo "A stable release must promote beta or an RC."; exit 1; }
          fi
          if [[ "${SOURCE_TAG}" == v* ]]; then
            [[ "${TAG_NAME%%-*}" == "${SOURCE_TAG%%-*}" ]] || { echo "Source and target tags must use the same base version."; exit 1; }
          fi
          RELEASE_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
          SOURCE_SHA="$(git rev-list -n 1 "${SOURCE_TAG}")"
          [[ "${RELEASE_SHA}" == "${SOURCE_SHA}" ]] || { echo "Release and source tags must resolve to the same tested commit."; exit 1; }
          git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main || { echo "Promoted commit is not in protected main."; exit 1; }
          VERSION="${TAG_NAME#v}"
          if [[ "${TAG_NAME}" == *-beta.* || "${TAG_NAME}" == *-rc.* ]]; then
            PRERELEASE=true
            RELEASE_ENVIRONMENT=beta
          else
            [[ "${INSTALLATION_TESTED}" == true ]] || { echo "Install and test the selected beta/RC before stable publication."; exit 1; }
            PRERELEASE=false
            RELEASE_ENVIRONMENT=production
          fi
          NOTES_BASE_TAG="$(git tag --merged "${RELEASE_SHA}" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fvx "${TAG_NAME}" | head -n 1 || true)"
          [[ -n "${NOTES_BASE_TAG}" ]] || { echo "No previous stable tag exists for changelog generation."; exit 1; }
          mkdir -p "${RUNNER_TEMP}/release-notes"
          node scripts/release-notes-bundle.mjs --from "${NOTES_BASE_TAG}" --to "${RELEASE_SHA}" --tag "${TAG_NAME}" --output "${RUNNER_TEMP}/release-notes/navet-release-notes.json"
          {
            echo "package_version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "release_environment=${RELEASE_ENVIRONMENT}"
            echo "release_sha=${RELEASE_SHA}"
            echo "notes_base_tag=${NOTES_BASE_TAG}"
          } >> "$GITHUB_OUTPUT"
      - name: Share pinned release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
          if-no-files-found: error

  source-evidence:
    name: Verify successful source publication
    runs-on: ubuntu-latest
    needs: release-context
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: node scripts/release-evidence.mjs verify-source

  custom-panel-artifact:
    name: Package Home Assistant Panel
    runs-on: ubuntu-latest
    needs: [release-context, source-evidence]
    environment: ${{ needs.release-context.outputs.release_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Reuse an already published panel archive
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .release-tools/scripts/release-assets.mjs restore-panel
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build custom panel
        if: steps.existing.outputs.exists != 'true'
        env:
          NAVET_BUILD_VERSION: ${{ needs.release-context.outputs.package_version }}
          NAVET_RELEASE_CHANNEL: ${{ needs.release-context.outputs.prerelease == 'true' && 'beta' || 'stable' }}
          NAVET_VERSION: ${{ needs.release-context.outputs.package_version }}
        run: pnpm build:ha-panel
      - name: Package custom panel artifact
        if: steps.existing.outputs.exists != 'true'
        run: |
          PANEL_STAGE="release-assets/panel/platform/home-assistant/custom_components/navet"
          mkdir -p "$PANEL_STAGE"
          cp -R apps/ha-panel/dist "$PANEL_STAGE/frontend"
          tar -C release-assets/panel -czf "$GITHUB_WORKSPACE/release-assets/navet-panel-${RELEASE_TAG}.tar.gz" platform/home-assistant/custom_components/navet/frontend
      - name: Upload custom panel artifact
        uses: actions/upload-artifact@v6
        with:
          name: navet-panel-${{ needs.release-context.outputs.tag_name }}
          path: release-assets/navet-panel-${{ needs.release-context.outputs.tag_name }}.tar.gz
          if-no-files-found: error

  images:
    permissions:
      contents: read
      packages: write
    needs: [release-context, source-evidence]
    uses: ./.github/workflows/release-image.yml
    secrets:
      NAVET_GHCR_TOKEN: ${{ secrets.NAVET_GHCR_TOKEN }}
    with:
      sha: ${{ needs.release-context.outputs.release_sha }}
      version: ${{ needs.release-context.outputs.package_version }}
      channel: ${{ needs.release-context.outputs.prerelease == 'true' && 'beta' || 'stable' }}
      environment: ${{ needs.release-context.outputs.release_environment }}

  runtime:
    needs: [release-context, images]
    uses: ./.github/workflows/release-runtime.yml
    with:
      sha: ${{ needs.release-context.outputs.release_sha }}
      version: ${{ needs.release-context.outputs.package_version }}
      channel: ${{ needs.release-context.outputs.prerelease == 'true' && 'beta' || 'stable' }}

  sync-hacs:
    name: Sync HACS Integration
    runs-on: ubuntu-latest
    needs: [release-context, runtime, custom-panel-artifact]
    concurrency:
      group: hacs-sync-navet-hacs-main
      cancel-in-progress: false
    environment: ${{ needs.release-context.outputs.release_environment }}
    if: github.repository == 'navet-app/navet'
    env:
      NAVET_HACS_APP_ID: ${{ secrets.NAVET_HACS_APP_ID }}
      NAVET_HACS_APP_PRIVATE_KEY: ${{ secrets.NAVET_HACS_APP_PRIVATE_KEY }}
    steps:
      - name: Check HACS sync secrets
        run: '[[ -n "${NAVET_HACS_APP_ID}" && -n "${NAVET_HACS_APP_PRIVATE_KEY}" ]]'
      - name: Checkout monorepo
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}
          fetch-depth: 0
      - name: Checkout trusted note tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Create GitHub App token for HACS sync
        id: hacs_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NAVET_HACS_APP_ID }}
          private-key: ${{ secrets.NAVET_HACS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: navet-home-assistant
      - name: Checkout HACS repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HACS_REPOSITORY }}
          ref: main
          path: navet-hacs
          token: ${{ steps.hacs_app_token.outputs.token }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download pinned release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Download the already built panel
        uses: actions/download-artifact@v7
        with:
          name: navet-panel-${{ needs.release-context.outputs.tag_name }}
          path: release-assets
      - name: Restore panel distribution
        run: |
          mkdir -p apps/ha-panel/dist
          tar -xzf "release-assets/navet-panel-${RELEASE_TAG}.tar.gz" --strip-components=5 -C apps/ha-panel/dist
      - name: Reuse an existing immutable HACS tag
        id: existing
        working-directory: navet-hacs
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git checkout --detach "${RELEASE_TAG}"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
      - name: Export HACS payload
        env:
          NAVET_SKIP_HA_PANEL_BUILD: '1'
          NAVET_HACS_EXPORT_ROOT: ${{ github.workspace }}/navet-hacs
          NAVET_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes/hacs.md
          NAVET_RELEASE_VERSION: ${{ needs.release-context.outputs.package_version }}
        run: |
          node scripts/export-hacs-integration.mjs
          node .release-tools/scripts/release-hacs-changelog.mjs
      - name: Commit and push HACS sync
        working-directory: navet-hacs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.existing.outputs.exists }}" == true ]]; then
            git diff --exit-code -- custom_components hacs.json README.md LICENSE .github CHANGELOG.md
            [[ -z "$(git ls-files --others --exclude-standard custom_components)" ]]
            exit 0
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release export from ${RELEASE_TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sync matching HACS release tag
        if: steps.existing.outputs.exists != 'true'
        working-directory: navet-hacs
        run: |
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Create matching HACS GitHub release
        env:
          GH_TOKEN: ${{ steps.hacs_app_token.outputs.token }}
          PRERELEASE: ${{ needs.release-context.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          NOTES_BUNDLE: ${{ runner.temp }}/release-notes/navet-release-notes.json
          NOTES_FILE: ${{ runner.temp }}/release-notes/hacs.md
        run: node .release-tools/scripts/release-hacs-notes.mjs

  github-release:
    permissions:
      contents: write
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [release-context, runtime, custom-panel-artifact, sync-hacs, publish-addon-metadata]
    environment: ${{ needs.release-context.outputs.release_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download custom panel artifact
        uses: actions/download-artifact@v7
        with:
          name: navet-panel-${{ needs.release-context.outputs.tag_name }}
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Download pinned release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Record the verified package identities
        env:
          VERSION: ${{ needs.release-context.outputs.package_version }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          RELEASE_CHANNEL: ${{ needs.release-context.outputs.prerelease == 'true' && 'beta' || 'stable' }}
          NOTES_BUNDLE: ${{ runner.temp }}/release-notes/navet-release-notes.json
        run: node scripts/release-evidence.mjs write
      - name: Create GitHub release without replacing published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.release-context.outputs.prerelease }}
          NOTES_FILE: ${{ runner.temp }}/release-notes/general.md
          NOTES_BUNDLE: ${{ runner.temp }}/release-notes/navet-release-notes.json
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: node scripts/release-assets.mjs publish

      - name: Preserve artifact identities and bind verification to this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: node scripts/release-evidence.mjs publish

  verify-release:
    name: Verify Installable Artifacts
    runs-on: ubuntu-latest
    needs: [release-context, runtime, custom-panel-artifact, sync-hacs]
    environment: ${{ needs.release-context.outputs.release_environment }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Verify exact container artifacts
        env:
          VERSION: ${{ needs.release-context.outputs.package_version }}
          TAG_NAME: ${{ needs.release-context.outputs.tag_name }}
        run: |
          docker buildx imagetools inspect "ghcr.io/awesomestvi/navet:${TAG_NAME}"
          docker buildx imagetools inspect "ghcr.io/awesomestvi/amd64-navet-addon:${VERSION}"
          docker buildx imagetools inspect "ghcr.io/awesomestvi/aarch64-navet-addon:${VERSION}"
      - name: Verify HACS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-context.outputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$HACS_REPOSITORY" --json tagName --jq '.tagName' | grep -Fx "$TAG_NAME"

  publish-addon-metadata:
    name: Publish Home Assistant App Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [release-context, verify-release]
    environment: ${{ needs.release-context.outputs.release_environment }}
    if: github.repository == 'navet-app/navet'
    steps:
      - name: Create GitHub App token for metadata PR
        id: navet_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NAVET_HACS_APP_ID }}
          private-key: ${{ secrets.NAVET_HACS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: navet
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout protected main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.navet_app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download pinned release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Checkout trusted metadata tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false

      - name: Prepare and open metadata PR
        id: metadata_pr
        env:
          GH_TOKEN: ${{ steps.navet_app_token.outputs.token }}
          NOTES_BASE_TAG: ${{ needs.release-context.outputs.notes_base_tag }}
          PRERELEASE: ${{ needs.release-context.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
          VERSION: ${{ needs.release-context.outputs.package_version }}
        run: |
          set -euo pipefail
          BRANCH="automation/release-metadata-${RELEASE_TAG}"
          EXISTING_PR="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${BRANCH}" --json url --jq '.[0].url // empty')"
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "pr_url=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes/homeAssistant.md"
          if [[ "${PRERELEASE}" == "true" ]]; then
            CHANNEL=dev
          else
            CHANNEL=stable
          fi
          node .release-tools/scripts/prepare-addon-release-metadata.mjs \
            --root "${GITHUB_WORKSPACE}" \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --tag "${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}"

          if git diff --quiet -- platform/home-assistant/addons .changes && [[ -z "$(git ls-files --others --exclude-standard platform/home-assistant/addons .changes)" ]]; then
            echo "Home Assistant App metadata is already current."
            exit 0
          fi

          git config user.name "navet-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add platform/home-assistant/addons .changes
          git commit -m "chore(release): publish Home Assistant App ${VERSION}"
          git push --set-upstream origin "${BRANCH}"

          BODY_FILE="${RUNNER_TEMP}/navet-addon-metadata-pr.md"
          printf '%s\n' \
            '<!-- navet-release-metadata -->' \
            'Publishes the Home Assistant App metadata after its release artifacts were verified.' \
            '' \
            "- Release: \`${RELEASE_TAG}\`" \
            "- Commit: \`${RELEASE_SHA}\`" \
            "- Channel: \`${CHANNEL}\`" \
            "- Images: \`ghcr.io/awesomestvi/{arch}-navet-addon:${VERSION}\`" \
            '' \
            'This PR was generated by the approved release workflow. Required checks must pass before it is merged.' \
            > "${BODY_FILE}"
          PR_URL="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${BRANCH}" \
            --title "chore(release): publish Home Assistant App ${VERSION}" \
            --body-file "${BODY_FILE}")"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify exact metadata PR contents
        id: metadata_content
        if: steps.metadata_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.metadata_pr.outputs.pr_url }}
          NOTES_BUNDLE: ${{ runner.temp }}/release-notes/navet-release-notes.json
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          METADATA_SHA="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
          export METADATA_SHA
          node .release-tools/scripts/verify-addon-release-metadata.mjs
          echo "sha=$METADATA_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge metadata PR
        if: steps.metadata_pr.outputs.pr_url != ''
        env:
          APP_TOKEN: ${{ steps.navet_app_token.outputs.token }}
          CHECKS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.metadata_pr.outputs.pr_url }}
          EXPECTED_HEAD: ${{ steps.metadata_content.outputs.sha }}
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 5100))
          while (( SECONDS < DEADLINE )); do
            CHECKS_JSON="$(GH_TOKEN="${CHECKS_TOKEN}" gh pr checks "${PR_URL}" --required --json name,state 2>/dev/null || true)"
            if [[ -n "${CHECKS_JSON}" ]]; then
              echo "${CHECKS_JSON}" | jq -r '.[] | "\(.state)\t\(.name)"'
              if echo "${CHECKS_JSON}" | jq -e 'any(.[]; .state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED")' >/dev/null; then
                echo "A required metadata PR check failed. The PR remains open for inspection."
                exit 1
              fi
            fi

            if GH_TOKEN="${APP_TOKEN}" gh pr merge "${PR_URL}" --match-head-commit "${EXPECTED_HEAD}" --squash --delete-branch; then
              echo "Merged ${PR_URL} through the protected main branch after all required checks passed."
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for required metadata PR checks. The PR remains open."
          exit 1

  verify-distribution:
    name: Verify Published Changelogs
    runs-on: ubuntu-latest
    needs: [release-context, github-release, publish-addon-metadata]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Compare all published notes with pinned evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          NOTES_BUNDLE: ${{ runner.temp }}/release-notes/navet-release-notes.json
        run: node scripts/verify-release-distribution.mjs

  publish-channels:
    permissions:
      contents: read
      packages: write
    name: Verify Complete Release
    runs-on: ubuntu-latest
    needs: [release-context, verify-release, publish-addon-metadata, verify-distribution]
    environment: ${{ needs.release-context.outputs.release_environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: awesomestvi
          password: ${{ secrets.NAVET_GHCR_TOKEN }}
      - name: Advance aliases from this run's verified evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-context.outputs.package_version }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          RELEASE_CHANNEL: ${{ needs.release-context.outputs.prerelease == 'true' && 'beta' || 'stable' }}
        run: |
          gh release download "$RELEASE_TAG" --pattern navet-release-evidence.json --repo "$GITHUB_REPOSITORY"
          node scripts/release-channels.mjs
          echo "Verified packages, distribution metadata and channel aliases are complete." >> "$GITHUB_STEP_SUMMARY"

  notify-included-issues:
    name: Notify issues in stable release
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [release-context, publish-channels]
    if: needs.release-context.outputs.prerelease == 'false' && github.repository == 'navet-app/navet'
    environment: production
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted release tooling and history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create issue-comment token for Navet Nisse
        id: nisse_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NAVET_NISSE_CLIENT_ID }}
          private-key: ${{ secrets.NAVET_NISSE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: navet
          permission-issues: write
      - name: Comment on linked issues once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAVET_NISSE_TOKEN: ${{ steps.nisse_token.outputs.token }}
          NOTES_BASE_TAG: ${{ needs.release-context.outputs.notes_base_tag }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: node scripts/notify-release-issues.mjs
