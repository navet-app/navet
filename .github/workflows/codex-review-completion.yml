name: Record Codex Review Completion

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR whose reviewed CI should resume
        required: true
        type: string
  issue_comment:
    types: [created, edited]

concurrency:
  group: codex-review-completion-${{ github.repository }}-${{ github.event.issue.number || inputs.pull_request_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  record:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      github.event.comment.user.id == 199175422 &&
      github.event.comment.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # issue_comment checks out trusted default-branch code, never the PR head.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Submit current-head completion review
        uses: actions/github-script@v8
        with:
          script: |
            const { recordCodexReviewCompletion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/codex-review-completion.mjs`);
            await recordCodexReviewCompletion({ github, context, core });
            const { dispatchReviewedCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/reviewed-ci.mjs`);
            await dispatchReviewedCi({ github, context, core });

  resume:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resume eligible PR CI
        uses: actions/github-script@v8
        with:
          script: |
            const { dispatchReviewedCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/reviewed-ci.mjs`);
            await dispatchReviewedCi({ github, context, core });
