name: Release Safety Checks

on:
  workflow_call:
    inputs:
      runtime:
        description: Build local runtime fixtures (published images are tested separately during Dev publication)
        type: boolean
        default: true

jobs:
  tier-1-release-critical:
    name: Run Release Safety Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tier 1 release-critical tests
        run: pnpm test:tier1

      - name: Test Home Assistant chore integration
        run: pnpm test:ha-integration

      - name: Check generated runtime policy parity
        run: node scripts/build-runtime-policies.mjs --check

      - name: Check RSS transport build
        run: pnpm check:rss-transport

      - name: Check provider boundaries
        run: node scripts/check-provider-boundaries.mjs

  addon-runtime:
    if: inputs.runtime
    name: Validate add-on runtime (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable multi-architecture containers
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker build, Ingress chores, and persisted restart
        run: pnpm check:docker
        env:
          NAVET_ADDON_TEST_ARCH: ${{ matrix.arch }}
