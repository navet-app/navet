name: CI

on:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number (select its branch above)
        required: true
        type: string
      head_sha:
        description: Reviewed commit SHA (automation pins this; manual runs use the selected branch)
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.review.outputs.base_sha }}
      head_sha: ${{ steps.review.outputs.head_sha }}
      checkout_sha: ${{ steps.review.outputs.checkout_sha }}
      number: ${{ steps.review.outputs.number }}
      author: ${{ steps.review.outputs.author }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: review
        uses: actions/github-script@v8
        with:
          script: |
            const { authorizeCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/reviewed-ci.mjs`);
            await authorizeCi({ github, context, core });

  impact:
    needs: review
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ needs.review.outputs.base_sha }}
      head_sha: ${{ needs.review.outputs.head_sha }}
      checkout_sha: ${{ needs.review.outputs.checkout_sha }}
      author: ${{ needs.review.outputs.author }}
      runtime: ${{ steps.impact.outputs.runtime }}
      website: ${{ steps.impact.outputs.website }}
      docs: ${{ steps.impact.outputs.docs }}
      demo: ${{ steps.impact.outputs.demo }}
      storybook: ${{ steps.impact.outputs.storybook }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.review.outputs.checkout_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - id: impact
        env:
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        run: node scripts/pipeline-impact.mjs

  quality:
    needs: impact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.impact.outputs.checkout_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release fragment
        env:
          NAVET_PR_AUTHOR_JSON: ${{ needs.impact.outputs.author }}
          BASE_SHA: ${{ needs.impact.outputs.base_sha }}
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
        run: node scripts/check-release-fragments.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Run checks
        run: pnpm check

      - name: Validate Storybook standards
        run: pnpm check:stories

      - name: Validate UI kit boundaries
        run: pnpm check:ui-kit

      - name: Validate composition registry contracts and guards
        run: pnpm test:registry

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate pipeline and packaging scripts
        if: needs.impact.outputs.runtime != 'true'
        run: pnpm exec vitest run --config vitest.unit.config.ts scripts

      - name: Validate GitHub workflow contracts
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -shellcheck= -pyflakes=

      - name: Build app
        if: needs.impact.outputs.runtime == 'true'
        run: pnpm build

      - name: Check bundle budgets
        if: needs.impact.outputs.runtime == 'true'
        run: pnpm check:bundle-budget

      - name: Build marketing website
        if: needs.impact.outputs.website == 'true'
        run: pnpm website:build

      - name: Check marketing website performance and security gates
        if: needs.impact.outputs.website == 'true'
        run: pnpm check:website-audit

      - name: Build public demo
        if: needs.impact.outputs.demo == 'true' || needs.impact.outputs.runtime == 'true'
        run: pnpm build:demo

      - name: Share tested demo build with visual review
        if: needs.impact.outputs.demo == 'true' || needs.impact.outputs.runtime == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-demo
          path: apps/demo/dist
          if-no-files-found: error

      - name: Build Storybook
        if: needs.impact.outputs.storybook == 'true'
        run: pnpm storybook:build

      - name: Build public documentation
        if: needs.impact.outputs.docs == 'true'
        run: pnpm docs:build

      - name: Run Lighthouse CI
        if: needs.impact.outputs.runtime == 'true'
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

  tier-1-release-critical:
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    uses: ./.github/workflows/provider-platform-validation.yml
    with:
      checkout_ref: ${{ needs.impact.outputs.checkout_sha }}

  tier-2-blocking-app-contracts:
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.impact.outputs.checkout_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tier 2 blocking app-contract tests
        run: pnpm test:tier2

  standalone-docker-smoke:
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.impact.outputs.checkout_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build standalone Docker image
        run: docker build -t navet:ci .

      - name: Boot standalone Docker image and verify HTTP response
        env:
          NAVET_DOCKER_IMAGE: navet:ci
        run: node scripts/docker-smoke.mjs

  tier-3-broad-regression:
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.impact.outputs.checkout_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tier 3 broad regression tests
        run: pnpm test:tier3 -- --exclude-blocking

  responsive-review:
    needs: [impact, quality]
    if: needs.impact.outputs.demo == 'true' || needs.impact.outputs.runtime == 'true'
    name: Responsive visual review
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.impact.outputs.checkout_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture responsive demo review and run smoke assertions
        uses: actions/download-artifact@v7
        with:
          name: ci-demo
          path: apps/demo/dist

      - name: Review the existing demo artifact
        run: node scripts/run-pr-visual-review.mjs

      - name: Upload responsive review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-review-${{ github.event.pull_request.number || github.run_id }}
          path: .cache/pr-review/*.png
          if-no-files-found: warn
          retention-days: 14

  product-review-gate:
    name: Product review gate
    timeout-minutes: 25
    if: always()
    runs-on: ubuntu-latest
    needs:
      - review
      - impact
      - quality
      - tier-1-release-critical
      - tier-2-blocking-app-contracts
      - standalone-docker-smoke
      - tier-3-broad-regression
      - responsive-review

    steps:
      - name: Require successful review eligibility
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: test "$REVIEW_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.review.outputs.checkout_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Recheck current review eligibility
        uses: actions/github-script@v8
        env:
          REVIEWED_MERGE_SHA: ${{ needs.review.outputs.checkout_sha }}
        with:
          script: |
            const { authorizeCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/reviewed-ci.mjs`);
            await authorizeCi({ github, context, core, expectedCheckout: process.env.REVIEWED_MERGE_SHA });
      - name: Require every deterministic gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/pipeline-gate.mjs

      - name: Require successful previews for affected sites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
          IMPACT_JSON: ${{ toJSON(needs.impact.outputs) }}
        run: node scripts/pages-gate.mjs
