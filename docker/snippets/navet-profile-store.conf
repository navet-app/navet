location ^~ /__navet_profile__/ {
  include /etc/nginx/snippets/navet-security-headers.conf;
  client_max_body_size 1m;
  # njs 0.8.x requestText cannot read bodies spilled to a temporary file.
  client_body_buffer_size 1m;
  add_header Cache-Control "no-store" always;
  # nginx-module-njs before 0.9.1 can dereference NULL when an njs response
  # receives either validator. Navet uses its monotonic revision header instead.
  if ($http_if_match != "") {
    return 428;
  }
  if ($http_if_unmodified_since != "") {
    return 428;
  }
  js_content navet_profile_store.handle;
}
