location ^~ /__navet_profile__/ {
  include /etc/nginx/snippets/navet-security-headers.conf;
  client_max_body_size 1m;
  # Keep accepted profile and preference bodies readable through njs requestText.
  client_body_buffer_size 1m;
  add_header Cache-Control "no-store" always;
  # Keep unsafe HTTP write validators out of njs 0.8.x response handling.
  if ($http_if_match != "") {
    return 428;
  }
  if ($http_if_unmodified_since != "") {
    return 428;
  }
  js_content navet_profile_store.handleIngress;
}
