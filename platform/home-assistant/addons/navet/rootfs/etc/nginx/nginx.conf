load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

env NAVET_HOMEY_CLIENT_ID;
env NAVET_HOMEY_CLIENT_SECRET;
env NAVET_HOMEY_REDIRECT_URI;
env NAVET_ALLOW_INSECURE_PROVIDER_TLS;
env NAVET_TRUST_HOME_ASSISTANT_INGRESS;
env NAVET_HOME_ASSISTANT_INGRESS_PORT;
env SUPERVISOR_TOKEN;

user nginx;
# Profile and preference revisions use a local synchronous file transaction.
# One event-driven worker keeps those precondition checks and writes serialized.
worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/octet-stream
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  js_path /etc/nginx/njs/;
  js_shared_dict_zone zone=navet_chore_management_sessions:1m timeout=30m evict;
  # njs requires at least eight host pages; allow for 64 KiB pages on ARM64.
  js_shared_dict_zone zone=navet_chore_scheduler:1m timeout=48h;
  js_import navet_rss_proxy from /etc/nginx/njs/rss-proxy.js;
  js_import navet_profile_store from /etc/nginx/njs/profile-store.js;
  js_import navet_chore_store from /etc/nginx/njs/chore-store.js;
  js_import navet_auth_store from /etc/nginx/njs/auth-store.js;
  js_import navet_device_sessions from /etc/nginx/njs/device-session-authority.js;
  js_import navet_homey_store from /etc/nginx/njs/homey-store.js;
  js_import navet_openhab_store from /etc/nginx/njs/openhab-store.js;
  js_import navet_ha_proxy from /etc/nginx/njs/ha-proxy.js;
  js_import navet_homey_proxy from /etc/nginx/njs/homey-proxy.js;
  js_import navet_openhab_proxy from /etc/nginx/njs/openhab-proxy.js;
  js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  js_fetch_timeout 10s;
  include /etc/nginx/resolver.conf;

  include /etc/nginx/http.d/*.conf;
}
